name: build-windows-installer

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        shell: pwsh
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --loglevel verbose
          if ($LASTEXITCODE -ne 0) {
            Write-Host "npm ci falhou; tentando npm install..."
            npm install --ignore-scripts --no-audit --no-fund --loglevel verbose
          }

      - name: Build
        run: npm run build

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.yml
            release/*.blockmap
