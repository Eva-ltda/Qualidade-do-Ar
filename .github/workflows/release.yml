name: build-windows-installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        shell: pwsh
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --loglevel verbose
          if ($LASTEXITCODE -ne 0) {
            Write-Host "npm ci falhou; tentando npm install..."
            npm install --ignore-scripts --no-audit --no-fund --loglevel verbose
          }

      - name: Build (renderer)
        run: npm run build:renderer

      - name: Build (electron)
        run: npm run build:electron

      - name: Generate icon
        run: npm run gen:icon

      - name: Package (electron-builder)
        run: npx electron-builder --win --x64 --publish never

      - name: List release output
        shell: pwsh
        run: |
          if (Test-Path release) { Get-ChildItem -Recurse release | Select-Object FullName, Length }
          else { Write-Host "Diretório release/ não encontrado" }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-win-x64
          path: release/**

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/**/*.exe
            release/**/*.yml
            release/**/*.blockmap
